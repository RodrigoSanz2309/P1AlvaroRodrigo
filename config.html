<!DOCTYPE html>
<html lang="es">
<head>
<title>Configuración - Smart Room</title>
<link rel="stylesheet" href="css/iroom.css">

</head>
<body>
    <header>
        <h1>Smart Room</h1>
    </header>    
    <main>
        <section>
            <h3>Datos de la habitación</h3>

            <label for="País">País:</label>
            <select id="País" name="País">
                <option value="España">España</option>
                <option value="Portugal">Portugal</option>
                <option value="Francia">Francia</option>
            </select>

            <br><br>

            <label for="Ciudad">Ciudad:</label>
            <select id="Ciudad" name="Ciudad">
                <option value="Madrid">Madrid</option>
                <option value="Barcelona">Barcelona</option>
                <option value="Valencia">Valencia</option>
            </select>

            <br><br>

            <label for="mapa">Mapa URL:</label>
            <input type="text" id="mapa" name="mapa" placeholder="Introduce la URL del mapa">
            
            <br><br>
            
            <label for="imagen">Imagen:<label>
            <input type="file" id="Imagen" name="Imagen">

            <br><br>
            <label for="Password">Contraseña:</label>
            <input type="Password" id="Password" name="Password">




        </section>


        </section>


        <section>
            <h3>Datos de los sensores</h3>

            <input type="checkbox" id="Temperatura">
            <label for="Temperatura">Temperatura</label>

            <br><br>

            <input type="checkbox" id="humedad">
            <label for="humedad">Humedad</label>

            <br><br>

            <input type="checkbox" id="co2">
            <label for="co2">CO2</label>

            <br><br>

            <input type="checkbox" id="movimiento">
            <label for="movimiento">Movimiento</label>
            
        </section>

    </main>
    
    <footer>Universidad de Alcala</footer>
</body>
</html>
