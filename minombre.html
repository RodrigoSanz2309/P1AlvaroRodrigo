<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi nombre</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>
<body>

    <h1>Introduzca su nombre</h1>
 
    <input type="text" id="nombre">
 
    <button onclick="guardarNombre()">Guardar</button>
 
    <script>
        function guardarNombre() {
            let nombre =
            document.getElementById("nombre").value;
 
            localStorage.setItem("fname", nombre);
        }
    </script>
 
</body>
</html>
